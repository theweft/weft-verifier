# Pinned toolchain. Nix (flake.nix) and rustup both read this file.
[toolchain]
channel = "1.99.1"
profile = "minimal"
components = ["rustfmt", "clippy"]
# Supported targets (see `just targets`):
# - Linux: x86-64, arm64, riscv64
# - bare metal: Cortex-M0/M0+ (thumbv6m), Cortex-M4F/M7 (thumbv7em), Cortex-M33 (thumbv8m.main),
#   RISC-V without atomics such as ESP32-C3 (riscv32imc), RISC-V with atomics such as ESP32-C6 (riscv32imac)
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "riscv64gc-unknown-linux-gnu",
  "thumbv6m-none-eabi",
  "thumbv7em-none-eabihf",
  "thumbv8m.main-none-eabihf",
  "riscv32imc-unknown-none-elf",
  "riscv32imac-unknown-none-elf",
]
